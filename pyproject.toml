[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "trame-colormaps"
version = "0.1.0"
description = "Self-contained colormap module for VTK color transfer functions in Trame apps"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
authors = [
    {name = "Kitware, Inc.", email = "trame@kitware.com"},
]
keywords = ["trame", "vtk", "colormap", "scientific-visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy",
    "trame>=3",
    "trame-dataclass>=2",
    "trame-vuetify>=2",
    "vtk>=9.6.1",
]

[project.urls]
Homepage = "https://github.com/Kitware/trame-colormaps"
Repository = "https://github.com/Kitware/trame-colormaps"
Issues = "https://github.com/Kitware/trame-colormaps/issues"

[project.optional-dependencies]
dev = [
    "build",
    "pre-commit",
    "pytest",
    "ruff",
    "twine",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trame_colormaps = ["presets/*.json"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Long JS template strings and Vue expressions cannot be split
"src/trame_colormaps/colorbar.py" = ["E501"]
"src/trame_colormaps/control_panel.py" = ["E501"]

[tool.codespell]
ignore-words-list = "buda,te,nd"
