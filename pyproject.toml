[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trame-colormaps"
version = "1.2.2"
description = "Self-contained colormap module for VTK color transfer functions in Trame apps"
readme = "README.md"
license = {text = "Apache Software License"}
requires-python = ">=3.10"
authors = [
    {name = "Kitware, Inc.", email = "trame@kitware.com"},
]
keywords = ["trame", "vtk", "colormap", "scientific-visualization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy",
    "trame>=3",
    "trame-dataclass>=2",
    "trame-vuetify>=3.2",
    "vtk",
]

[project.urls]
Homepage = "https://github.com/Kitware/trame-colormaps"
Repository = "https://github.com/Kitware/trame-colormaps"
Issues = "https://github.com/Kitware/trame-colormaps/issues"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.hatch.build]
include = [
  "/src/**/*.py",
  "/src/trame_colormaps/**/*.css",
  "/src/trame_colormaps/**/*.json",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/trame",
    "src/trame_colormaps",
]

[tool.ruff]
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Long JS template strings and Vue expressions cannot be split
"src/trame_colormaps/colorbar.py" = ["E501"]
"src/trame_colormaps/control_panel.py" = ["E501"]

[tool.codespell]
ignore-words-list = "buda,te,nd"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]
version_variables = [
    "src/trame_colormaps/__init__.py:__version__",
]

build_command = """
    python -m pip install uv
    uv build
"""

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
